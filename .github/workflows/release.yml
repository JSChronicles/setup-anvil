name: Release

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions: {}

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  continuous-integration:
    name: Continuous integration
    permissions:
      contents: read
    uses: ./.github/workflows/ci.yml

  check-dist:
    name: Check bundled JavaScript
    permissions:
      contents: read
    uses: ./.github/workflows/check-dist.yml

  release:
    name: Publish semantic release
    needs:
      - continuous-integration
      - check-dist
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write

    steps:
      - name: Checkout full history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Publish release
        id: release
        shell: bash
        env:
          GH_REPO: ${{ github.repository }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          published_tag=$(gh release list \
            --exclude-drafts \
            --limit 1 \
            --json tagName \
            --jq '.[0].tagName // ""')

          if [[ -z "$published_tag" ]]; then
            version=$(node -p "require('./package.json').version")
            tag="v$version"

            if ! [[ "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([+-][0-9A-Za-z.-]+)?$ ]]; then
              echo "::error::package.json version $version is not valid Semantic Versioning."
              exit 1
            fi

            if release_json=$(gh release view "$tag" --json isDraft 2>/dev/null); then
              if [[ $(jq -r '.isDraft' <<<"$release_json") != 'true' ]]; then
                echo "::error::Published release $tag exists without a matching Git tag."
                exit 1
              fi

              notes_json=$(gh api --method POST "repos/$GH_REPO/releases/generate-notes" \
                -f tag_name="$tag" \
                -f target_commitish="$GITHUB_SHA")
              jq -r '.body' <<<"$notes_json" > "$RUNNER_TEMP/release-notes.md"
              release_title=$(jq -r '.name' <<<"$notes_json")
              gh release edit "$tag" \
                --target "$GITHUB_SHA" \
                --title "$release_title" \
                --notes-file "$RUNNER_TEMP/release-notes.md" \
                --draft=false \
                --latest
            else
              gh release create "$tag" \
                --target "$GITHUB_SHA" \
                --generate-notes \
                --latest
            fi
          else
            npm exec -- semantic-release
          fi

          git fetch --force --tags origin
          tag=$(git tag --points-at "$GITHUB_SHA" --list 'v*' --sort=-version:refname |
            grep -E '^v[0-9]+\.[0-9]+\.[0-9]+([+-][0-9A-Za-z.-]+)?$' |
            head -n 1 || true)

          if [[ -z "$tag" ]]; then
            echo 'No release was generated from this push.'
            echo 'released=false' >> "$GITHUB_OUTPUT"
          else
            echo "Released $tag."
            echo 'released=true' >> "$GITHUB_OUTPUT"
            echo "tag=$tag" >> "$GITHUB_OUTPUT"
          fi

      - name: Create or update floating major tag
        if: steps.release.outputs.released == 'true'
        shell: bash
        env:
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: |
          set -euo pipefail

          version=${RELEASE_TAG#v}
          version_without_build=${version%%+*}
          if [[ "$version_without_build" == *-* ]]; then
            echo "Prerelease $RELEASE_TAG does not update a stable compatibility tag."
            exit 0
          fi

          major=${version%%.*}
          floating_tag="v$major"
          target_sha=$(gh api "repos/$GH_REPO/git/ref/tags/$RELEASE_TAG" --jq '.object.sha')
          floating_count=$(gh api "repos/$GH_REPO/git/matching-refs/tags/$floating_tag" |
            jq --arg ref "refs/tags/$floating_tag" '[.[] | select(.ref == $ref)] | length')

          if [[ "$floating_count" == '0' ]]; then
            gh api --method POST "repos/$GH_REPO/git/refs" \
              -f ref="refs/tags/$floating_tag" \
              -f sha="$target_sha" >/dev/null
            echo "Created $floating_tag at $target_sha."
          else
            gh api --method PATCH "repos/$GH_REPO/git/refs/tags/$floating_tag" \
              -f sha="$target_sha" \
              -F force=true >/dev/null
            echo "Updated $floating_tag to $target_sha."
          fi

      - name: Create template dispatch token
        if: steps.release.outputs.released == 'true'
        id: template-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ secrets.PYTHON_RELEASE_BOT_CLIENT_ID }}
          private-key: ${{ secrets.PYTHON_RELEASE_BOT_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: foundry-anvil-template
          permission-contents: write

      - name: Request template update
        if: steps.release.outputs.released == 'true'
        env:
          GH_TOKEN: ${{ steps.template-token.outputs.token }}
          OWNER: ${{ github.repository_owner }}
          SETUP_SHA: ${{ github.sha }}
          SETUP_TAG: ${{ steps.release.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail

          anvil_version=$(jq --raw-output '.anvil_version' .github/anvil-compatibility.json)
          if ! [[ "$anvil_version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::compatibility metadata does not contain a stable Anvil version"
            exit 1
          fi

          jq --null-input \
            --arg anvil_version "$anvil_version" \
            --arg setup_sha "$SETUP_SHA" \
            --arg setup_tag "$SETUP_TAG" \
            '{
              event_type: "setup_anvil_released",
              client_payload: {
                anvil_version: $anvil_version,
                setup_sha: $setup_sha,
                setup_tag: $setup_tag
              }
            }' > "$RUNNER_TEMP/setup-anvil-release.json"

          gh api \
            --method POST \
            "repos/${OWNER}/foundry-anvil-template/dispatches" \
            --input "$RUNNER_TEMP/setup-anvil-release.json"
