name: Setup Anvil
description:
  Set up Anvil and install provider dependencies from its config files
author: JSChronicles

branding:
  icon: terminal
  color: gray-dark

inputs:
  anvil-version:
    description: Exact Anvil version to install, or "latest"
    required: false
    default: '0.31.0'
  python-version:
    description: Optional Python version override for the isolated Anvil runtime
    required: false
    default: ''

outputs:
  anvil-version:
    description: The exact installed Anvil version
    value: ${{ steps.setup-anvil.outputs.anvil-version }}

runs:
  using: composite
  steps:
    - name: Install uv
      uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
      with:
        version: '0.12.3'
        enable-cache: false

    - name: Set up Anvil
      id: setup-anvil
      uses: $/dist/setup
      with:
        anvil-version: ${{ inputs.anvil-version }}
        python-version: ${{ inputs.python-version }}
