name: Setup Anvil
description:
  Set up Anvil with checked-out project plugins and selected provider
  dependencies
author: JSChronicles

branding:
  icon: terminal
  color: gray-dark

inputs:
  anvil-version:
    description: Exact Anvil version to install, or "latest"
    required: false
    default: latest
  python-version:
    description: Optional Python version override for the isolated Anvil runtime
    required: false
    default: ''

outputs:
  anvil-version:
    description: The exact installed Anvil version
    value: ${{ steps.setup-anvil.outputs.anvil-version }}

runs:
  using: composite
  steps:
    - name: Install uv
      uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
      with:
        version: '0.12.16'
        enable-cache: false

    - name: Set up Anvil
      id: setup-anvil
      uses: $/dist/setup
      with:
        anvil-version: ${{ inputs.anvil-version }}
        python-version: ${{ inputs.python-version }}
